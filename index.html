<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HitecApp - Tool for Safety Indonesia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-950 text-slate-50 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">
    <div id="root" class="h-full"></div>
    <script>
      // Automatic Asset & Stylesheet Load Error Recovery: force cache-busting query parameter if asset load error occurs
      window.addEventListener('error', function(e) {
        var msg = e && e.message ? String(e.message).toLowerCase() : '';
        var target = e && e.target ? e.target : null;
        var isAssetError = msg.indexOf('script') !== -1 || msg.indexOf('style') !== -1 || msg.indexOf('mime type') !== -1 || (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK'));
        if (isAssetError) {
          var reloadKey = 'hitec_asset_reload_' + Math.floor(Date.now() / 15000);
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            window.location.replace(window.location.pathname + '?v=' + Date.now());
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

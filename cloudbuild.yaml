# Direct Local Deployment Pipeline via `gcloud builds submit`
# No GitHub webhooks, triggers, or git remotes involved. Runs 100% locally to GCP.

steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Build Vite production bundle
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3. Deploy build artifacts directly to Firebase Hosting & GCP
  - name: 'gcr.io/$_PROJECT_ID/firebase'
    args: ['deploy', '--only', 'hosting,firestore,storage,functions', '--project', '$_PROJECT_ID']

substitutions:
  _PROJECT_ID: 'hitecmedia-app'
  _REGION: 'asia-southeast2'

timeout: '600s'
